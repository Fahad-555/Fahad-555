<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16" role="img" aria-label="divider">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F85D7F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F85D7F"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F85D7F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Static track -->
  <rect x="0" y="7" width="900" height="2" rx="1" fill="#2b3040"/>

  <!-- Moving laser (transform only, no blur filter, so it stays smooth) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-160 0;780 0;-160 0" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.37 0 0.63 1;0.37 0 0.63 1"/>
    <rect x="0" y="3" width="280" height="10" fill="url(#trail)" fill-opacity="0.3"/>
    <rect x="0" y="5.5" width="280" height="5" fill="url(#trail)" fill-opacity="0.6"/>
    <rect x="0" y="7" width="280" height="2" fill="url(#trail)"/>
  </g>
</svg>
