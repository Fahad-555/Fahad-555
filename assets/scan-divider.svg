<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16" role="img" aria-label="divider">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F85D7F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F85D7F"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F85D7F" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-600%" width="140%" height="1400%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Static track -->
  <rect x="0" y="7" width="900" height="2" rx="1" fill="#2b3040"/>

  <!-- Moving laser: left to right, then right to left -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-160 0;780 0;-160 0" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <rect x="0" y="6" width="280" height="4" fill="url(#trail)" filter="url(#blur)"/>
    <rect x="0" y="7" width="280" height="2" fill="url(#trail)"/>
  </g>
</svg>
