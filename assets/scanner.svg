<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Muhammad Fahad - Computer Science Student, Full Stack Developer, SEO Specialist and WordPress Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b1f2b"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F85D7F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F85D7F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F85D7F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F85D7F" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#F85D7F"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.85" stop-color="#F85D7F"/>
      <stop offset="1" stop-color="#F85D7F" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- Everything above the beam is "revealed" in bright colours -->
    <clipPath id="revealClip">
      <rect x="0" y="0" width="900" height="0">
        <animate attributeName="height" values="0;210;0" keyTimes="0;0.5;1" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="898" height="208" rx="14" fill="url(#bg)" stroke="#2b3040" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="208" rx="14" fill="url(#grid)"/>

  <!-- Scanner corner brackets -->
  <g fill="none" stroke="#F85D7F" stroke-width="3" stroke-linecap="round">
    <path d="M20 42V22a6 6 0 0 1 6-6h22"/>
    <path d="M880 42V22a6 6 0 0 0-6-6h-22"/>
    <path d="M20 168v20a6 6 0 0 0 6 6h22"/>
    <path d="M880 168v20a6 6 0 0 1-6 6h-22"/>
  </g>

  <!-- HUD labels -->
  <g font-family="Fira Code, Consolas, 'Courier New', monospace" font-size="11" fill="#8b93a7">
    <circle cx="40" cy="30" r="3.5" fill="#F85D7F">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="34" letter-spacing="2">SCANNING...</text>
    <text x="860" y="34" text-anchor="end" letter-spacing="2">ID: FAHAD-555</text>
    <text x="40" y="190" letter-spacing="2">MULTAN, PK</text>
    <text x="860" y="190" text-anchor="end" letter-spacing="2">SEO &#8226; WP &#8226; FULL STACK</text>
  </g>

  <!-- Dim base text (visible before the beam passes) -->
  <g font-family="Fira Code, Consolas, 'Courier New', monospace" text-anchor="middle">
    <text x="450" y="82" font-size="38" font-weight="700" fill="#4a5063" letter-spacing="3">MUHAMMAD FAHAD</text>
    <text x="450" y="113" font-size="17" fill="#4a5063">Computer Science Student  &#8226;  Full Stack Developer</text>
    <text x="450" y="140" font-size="18" font-weight="700" fill="#6b3a4a">SEO Specialist &amp; WordPress Developer</text>
    <text x="450" y="164" font-size="14" fill="#4a5063">On-Page  &#8226;  Off-Page  &#8226;  Technical  &#8226;  Local SEO</text>
  </g>

  <!-- Bright text revealed by the scanner -->
  <g clip-path="url(#revealClip)" font-family="Fira Code, Consolas, 'Courier New', monospace" text-anchor="middle">
    <text x="450" y="82" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="3">MUHAMMAD FAHAD</text>
    <text x="450" y="113" font-size="17" fill="#e6e9f2">Computer Science Student  &#8226;  Full Stack Developer</text>
    <text x="450" y="140" font-size="18" font-weight="700" fill="#F85D7F">SEO Specialist &amp; WordPress Developer</text>
    <text x="450" y="164" font-size="14" fill="#F8D866">On-Page  &#8226;  Off-Page  &#8226;  Technical  &#8226;  Local SEO</text>
  </g>

  <!-- Laser scanning beam: top to bottom, then bottom to top -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 210;0 0" keyTimes="0;0.5;1" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <rect x="1" y="-22" width="898" height="44" fill="url(#beam)"/>
    <rect x="1" y="-2" width="898" height="4" fill="url(#edge)" filter="url(#glow)"/>
    <rect x="1" y="-1.25" width="898" height="2.5" fill="url(#edge)"/>
  </g>
</svg>
